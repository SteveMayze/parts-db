---
# Points the app back at the OLD folders in the home folder.  make rollback-storage
# Meant for use soon after make relocate-storage, while the old folders are still the kept copy. Changes made since the
# relocation exist only on /u01: a verified backup of the current state is taken first, so they can be restored.
# Nothing is deleted or moved.
- name: Roll the parts-db storage back to the old folders
  hosts: partsdb_rootless
  gather_facts: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ service_uid | default('') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ service_uid | default('') }}/bus"
  vars:
    use_u01: true
    new_flags: "{{ podman_run_flags }}"            # the current (u01) layout, for the safety backup
  tasks:
    - name: Connected as the service user, with linger on and a running user systemd
      ansible.builtin.include_tasks: tasks/service-session.yml

    - name: Which storage layout does the server use now?
      ansible.builtin.command: "cat {{ storage_marker }}"
      register: marker
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Only a relocated server can be rolled back (nothing was changed)
      ansible.builtin.assert:
        that: (marker.stdout | trim or 'legacy') == 'u01'
        fail_msg: "The server already uses the old folders. Nothing was changed."

    - name: The old folders must still be there (nothing was changed)
      ansible.builtin.stat:
        path: "{{ legacy_root }}/{{ item }}"
        get_checksum: false
      loop: [data, media, backups]
      register: old_dirs

    - name: Assert they exist
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.isdir
        fail_msg: "{{ legacy_root }}/{{ item.item }} is gone, so there is nothing to go back to. Nothing was changed."
      loop: "{{ old_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Confirmation (type ROLLBACK, or -e confirm_rollback=ROLLBACK)
      ansible.builtin.pause:
        prompt: "The app will use the old folders again; changes made since the relocation stay on {{ storage_root }}. Type ROLLBACK"
      register: answer
      when: confirm_rollback is not defined

    - name: Require the confirmation
      ansible.builtin.assert:
        that: (confirm_rollback | default(answer.user_input | default(''))) == 'ROLLBACK'
        fail_msg: "Not confirmed. Nothing was changed."

    - name: Safety backup of the current state (stored on the new disk)
      ansible.builtin.command: >-
        podman run {{ new_flags }} {{ image_repo }}:current
        python manage.py backup_db --label pre-rollback-storage
      register: safety
      changed_when: "'BACKUP_CREATED' in safety.stdout"

    - name: Stop the app
      ansible.builtin.systemd:
        scope: user
        name: "{{ container_name }}.service"
        state: stopped

    - name: Remember that the data is in the old folders again
      ansible.builtin.copy:
        dest: "{{ storage_marker }}"
        content: "legacy\n"
        mode: "0600"

    - name: Install the unit pointing at the old folders
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      vars:
        use_u01: false
      loop:
        - {src: parts-db-web.container.j2, dest: "{{ quadlet_dir }}/{{ container_name }}.container", mode: "0644"}
        - {src: parts-db-backup.service.j2, dest: "{{ unit_dir }}/parts-db-backup.service", mode: "0644"}
        - {src: manage.sh.j2, dest: "{{ bin_dir }}/{{ app_name }}-manage", mode: "0750"}

    - name: Reload systemd and start the app
      ansible.builtin.systemd:
        scope: user
        name: "{{ container_name }}.service"
        state: restarted
        daemon_reload: true

    - name: Wait until the container reports healthy
      ansible.builtin.command: "podman inspect --format {% raw %}'{{.State.Health.Status}}'{% endraw %} {{ container_name }}"
      register: health
      until: health.stdout == 'healthy'
      retries: 45
      delay: 4
      changed_when: false

    - name: Result
      ansible.builtin.debug:
        msg:
          - "The app uses {{ legacy_root }}/{data,media,backups} again."
          - "Safety backup of the state before the rollback: {{ (safety.stdout | default('')).strip() }} (on {{ storage_root }}/backups)"
          - "A later  make deploy  needs  -e use_u01=false  (or edit group_vars) while the old folders are in use."
